<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันคำสั่งซื้อ — MAISON NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500&family=Noto+Serif+Thai:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo">MAISON NOIR</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้าทั้งหมด</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-title">
          <span class="eyebrow">Checkout</span>
          <h2>ยืนยันคำสั่งซื้อ</h2>
        </div>

        <form id="orderForm" class="form-narrow">
          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required>
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="เช่น สี ที่ต้องการ, ที่อยู่จัดส่ง ฯลฯ"></textarea>
          </div>

          <button type="submit" class="btn btn-accent form-submit">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="logo">MAISON NOIR</span>
    <p>&copy; 2026 Maison Noir. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
